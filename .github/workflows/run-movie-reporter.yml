name: Run Movie Reporter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "report.go"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/run-movie-reporter.yml"
  pull_request:
    paths:
      - "data/**"
      - "report.go"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/run-movie-reporter.yml"

concurrency:
  group: movie-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build report from committed data
        run: go run . report

      - name: Verify output
        run: |
          test -s data/now_playing.json
          test -s data/movies_enriched.json
          test -s index.html
          grep -q 'class="cinema-link apollo-link"' index.html

      - name: Commit report
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Build movie report [skip ci]"
            git push
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: movie-report
          path: |
            data/
            index.html
          retention-days: 30

  create-release:
    needs: build-report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: movie-report

      - name: Prepare release metadata
        id: metadata
        run: |
          echo "tag=v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "movies=$(jq 'length' data/movies_enriched.json)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Movie Report ${{ steps.metadata.outputs.date }}
          body: |
            Automated movie report from Forum Cinemas.

            Movies found: ${{ steps.metadata.outputs.movies }}
          files: |
            data/movies_enriched.json
            data/now_playing.json
            index.html
